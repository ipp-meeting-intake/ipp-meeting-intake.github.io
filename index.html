  });
}

/* ═══════════════════════════════════════════════════════════════════
   4) SUBMIT — Apps Script if available, else copy/email fallback
   ═══════════════════════════════════════════════════════════════════ */
function buildPayload(){
  const answers={};
  const SKIP=["legal_name","preferred_name","dob"];  // captured at top level; avoid duplicate Sheet columns
  STEPS.forEach(s=>s.fields.forEach(f=>{ if(f.type!=="note" && f.type!=="booking" && !SKIP.includes(f.key)) answers[f.key]=displayVal(f); }));
  return {
    submittedAt: new Date().toISOString(),
    lang,
    token: window.VMRC_CONFIG.token||"",   // light anti-spam (validated by Code.gs)
    legal_name: data.legal_name||"",
    preferred_name: data.preferred_name||"",
    dob: fmtDate(data.dob),
    answers,
    raw: data
  };
}

function submit(){
  const btn=document.getElementById("sendBtn"); const err=document.getElementById("sendErr");
  err.classList.remove("ok"); err.style.display="none";
  // Honeypot: a real person can't see/fill this field, so if it has a value it's
  // a bot. Pretend it worked (show the thank-you) but never send or save it.
  const hp=document.getElementById("vmrc_company");
  if(hp && hp.value.trim()){ clearDraft(); idx=STEPS.length+1; render(); return; }
  if(!(data.legal_name||"").trim()){
    err.textContent = X("Please enter the person's name (step 1).","Por favor ingrese el nombre de la persona (paso 1).");
    err.style.display="block"; idx=0; setTimeout(()=>{persist();render();},900); return;
  }
  const payload=buildPayload();
  // ── CLOUD SUBMISSION DISABLED (privacy / Option C) ──────────────────────────
  // The form NEVER transmits anything — no Apps Script call, no Google Sheet, no
  // network request of any kind. The family hands their answers to the coordinator
  // directly via the encrypted Copy / Email options below, so the information goes
  // ONLY to the coordinator they choose to send it to. Nothing is stored online.
  showFallback(payload);
}

function summaryText(p){
  let s = `VMRC PRE-MEETING INTAKE\n${"=".repeat(28)}\n`;
  s += `Name: ${p.legal_name}${p.preferred_name?` ("${p.preferred_name}")`:""}\n`;
  if(p.dob) s+=`DOB: ${p.dob}\n`;
  s += `Submitted: ${new Date(p.submittedAt).toLocaleString()}\n`;
  STEPS.forEach(step=>{
    const lines=step.fields.map(f=>{ const v=p.answers[f.key]; return v?`  • ${tx(f.label)}: ${v}`:null; }).filter(Boolean);
    if(lines.length){ s+=`\n${step.icon} ${tx(step.title).toUpperCase()}\n${lines.join("\n")}\n`; }
  });
  // Machine-readable block: lets the coordinator's IPP tool auto-fill the header
  // from this same summary (no re-typing). Identifying data only — stays between
  // the family and the coordinator. The IPP tool scans for the VMRC-IPP-DATA fence.
  s += `\n${"-".repeat(28)}\n`;
  s += (X("DATA FOR YOUR COORDINATOR — please keep these lines:\n","DATOS PARA SU COORDINADOR — por favor no borre estas líneas:\n"));
  s += "----- VMRC-IPP-DATA -----\n";
  // Full structured payload so the coordinator's IPP tool can pull in as much as
  // possible (header fields + a "Family Intake" reference panel). This travels only
  // to the coordinator the family sends it to — cloud submission is OFF.
  var _form=Object.assign({}, p.raw||{}); delete _form.__step; delete _form.__imported;
  s += JSON.stringify({ submittedAt:p.submittedAt, legal_name:p.legal_name, preferred_name:p.preferred_name, dob:p.dob, lang:p.lang, answers:p.answers, form:_form }) + "\n";
  s += "----- END -----\n";
  return s;
}

/* ── Encrypted send (2026-07-22) ─────────────────────────────────────
   The summary is encrypted IN THE FAMILY'S BROWSER before any send option:
   one-time AES-256-GCM key for the text, sealed with the coordinator's
   RSA-OAEP-256 public key (VMRC_CONFIG.pubKey). Copy / Gmail / Email carry
   ONLY ciphertext; the coordinator opens it locally with a code-protected
   decoder. (2026-07-23: the plaintext Download option and last-year re-import
   were removed at Justin's request — nothing readable leaves the browser.) */
const ENC_HDR="----- IPP-INTAKE ENCRYPTED v1 -----", ENC_END="----- END -----";
function abToB64(buf){ let s="",b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
// base64url (no padding): URL-safe AND avoids percent-encoding bloat in mailto links
function abToB64u(buf){ return abToB64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function encryptForCoordinator(text){
  const jwk=window.VMRC_CONFIG.pubKey;
  if(!jwk||!window.crypto||!crypto.subtle) throw new Error("no-crypto");
  const pub=await crypto.subtle.importKey("jwk",jwk,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  // Compress before encrypting (3-4x smaller → email URLs stay under client limits).
  // z:1 marks compressed payloads; browsers without CompressionStream send z:0.
  let raw=new TextEncoder().encode(text).buffer, z=0;
  if(window.CompressionStream){
    try{ raw=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); z=1; }
    catch(e){ raw=new TextEncoder().encode(text).buffer; z=0; }
  }
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,raw);
  const wk=await crypto.subtle.encrypt({name:"RSA-OAEP"},pub,await crypto.subtle.exportKey("raw",aes));
  // Compact envelope: dot-joined base64url segments (no JSON+btoa double-encoding —
  // that cost ~33% extra length). Format: IPP1.<z>.<wrappedKey>.<iv>.<ciphertext>
  const env=["IPP1",z,abToB64u(wk),abToB64u(iv.buffer),abToB64u(ct)].join(".");
  // Recipient tag (2026-08-31): a machine-readable line ABOVE the fence naming the
  // coordinator this envelope is sealed to. Old decoders ignore it (they only read
  // between the fences); new ones use it to say "this intake is addressed to <Name>"
  // instead of a dead-end error when it lands in the wrong inbox. It names only the
  // coordinator — never the family — and needs no translation (address label, not prose).
  const tag="[IPP-INTAKE for: "+(window.VMRC_CONFIG.coordinatorName||"")+" / "+(window.VMRC_SC_ID||"")+"]";
  return tag+"\n"+ENC_HDR+"\n"+(env.match(/.{1,76}/g)||[]).join("\n")+"\n"+ENC_END;
}

function showFallback(p){
  const fb=document.getElementById("fallback"); fb.style.display="block";
  const text=summaryText(p);
  document.getElementById("fallbackText").value=text;
  // Done → thank-you screen (what-to-bring checklist + clear-my-data)
  const fd=document.getElementById("fbDone");
  if(fd) fd.onclick=()=>{ idx=STEPS.length+1; persist(); render(); };
  const email=window.VMRC_CONFIG.coordinatorEmail||"";
  const scName=window.VMRC_CONFIG.coordinatorName||"";
  // Show WHO this goes to — the ?sc= link already picked the right coordinator.
  const st=document.getElementById("sendTo");
  if(st) st.innerHTML="📧 "+X("This goes to <b>{0}</b> — {1}","Esto va a <b>{0}</b> — {1}",[esc(scName),esc(email)]);
  // Subject carries NO name — the person's identity travels only inside the ciphertext.
  const subj=encodeURIComponent(X("Meeting intake form (encrypted)","Formulario de preparación (cifrado)"));
  const cBtn=document.getElementById("copyBtn"), gBtn=document.getElementById("gmailBtn"), eBtn=document.getElementById("emailBtn");
  [cBtn,gBtn,eBtn].forEach(b=>{ b.disabled=true; b.style.opacity=".55"; });
  encryptForCoordinator(text).then(enc=>{
    const note=X("This message is encrypted for your Service Coordinator. Please send it exactly as it is — do not edit it.","Este mensaje está cifrado para su Coordinador de Servicios. Envíelo tal como está — no lo edite.");
    const msg=note+"\n\n"+enc, body=encodeURIComponent(msg);
    // URL-length guard: a truncated ciphertext is unreadable (AES-GCM auth fails), so
    // never offer a transport the body won't survive. Copy has no length limit.
    const gmailURL=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${subj}&body=${body}`;
    const mailtoURL=`mailto:${email}?subject=${subj}&body=${body}`;
    const mailtoOK=mailtoURL.length<=1800, gmailOK=gmailURL.length<=6500;
    [cBtn,gBtn,eBtn].forEach(b=>{ b.disabled=false; b.style.opacity="1"; });
    const markSent=()=>{ window.__sendActed=true; };
    const manualCopy=()=>{                       // clipboard blocked → selectable fallback
      let ta=document.getElementById("encManual");
      if(!ta){ ta=document.createElement("textarea"); ta.id="encManual"; ta.readOnly=true;
        ta.style.cssText="width:100%;min-height:120px;margin-top:10px;font:12px monospace";
        cBtn.parentNode.insertAdjacentElement("afterend",ta); }
      ta.value=msg; ta.style.display="block"; ta.focus(); ta.select();
      const err=document.getElementById("sendErr");
      err.textContent=X("Copying didn't work on this device. The message is selected below — press and hold (or Ctrl+C) to copy it, then paste it into an email.","No se pudo copiar en este dispositivo. El mensaje está seleccionado abajo — manténgalo presionado (o Ctrl+C) para copiarlo, y péguelo en un correo.");
      err.classList.remove("ok"); err.style.display="block";
    };
    cBtn.onclick=()=>{
      if(!(navigator.clipboard&&navigator.clipboard.writeText)) return manualCopy();
      navigator.clipboard.writeText(msg).then(()=>{ markSent(); cBtn.textContent="✓ "+(X("Copied","Copiado")); }).catch(manualCopy);
    };
    // When the message is too long for the URL, the button still works: it copies
    // the encrypted message first, then opens a compose window ALREADY addressed
    // to the coordinator (To + Subject filled) with a translated "paste here" note.
    // A truncated ciphertext is unreadable (AES-GCM auth fails), so the full body
    // only rides the URL when it fits.
    const pasteBody=encodeURIComponent(X("PASTE YOUR ANSWERS HERE — press and hold in the message, then tap Paste. (Your encrypted answers were copied when you tapped the button.) Please send without changing anything.","PEGUE SUS RESPUESTAS AQUÍ — mantenga presionado en el mensaje y toque Pegar. (Sus respuestas cifradas se copiaron al tocar el botón.) Por favor envíe sin cambiar nada."));
    const copiedNote=()=>{ const n=document.getElementById("sendErr");
      n.textContent="✓ "+X("Copied. In the email that just opened, press and hold in the message area, then tap Paste — and send.","Copiado. En el correo que se abrió, mantenga presionado en el área del mensaje, toque Pegar — y envíe.");
      n.classList.add("ok"); n.style.display="block"; };
    // Synchronous copy inside the tap. The async Clipboard API rejects with
    // "Document is not focused" the moment a new tab takes focus — which is
    // exactly what these buttons do next — so the compose window would claim
    // "your answers were copied" when the copy silently failed. execCommand
    // runs before the tab opens; compose only opens after a confirmed copy.
    const syncCopy=(text)=>{ try{
      const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;left:-9999px;top:0"; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0,text.length);
      const ok=document.execCommand("copy"); ta.remove(); return !!ok;
    }catch(e){ return false; } };
    const gmailShort=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${subj}&body=${pasteBody}`;
    const mailtoShort=`mailto:${email}?subject=${subj}&body=${pasteBody}`;
    // Gmail web compose — pre-fills To/Subject/Body in a Gmail tab, no default mail app needed
    if(gmailOK){ gBtn.dataset.href=gmailURL; gBtn.onclick=()=>{ markSent(); window.open(gmailURL,"_blank"); }; }
    else { gBtn.dataset.href=gmailShort; gBtn.onclick=()=>{
      if(!syncCopy(msg)) return manualCopy();      // no compose unless the copy really happened
      markSent(); copiedNote();
      const w=window.open(gmailShort,"_blank");    // sync inside the gesture — beats popup blockers
      if(!w) window.location.href=gmailShort;      // blocked anyway → same-tab compose (draft is saved)
    }; }
    // mailto — hands off to the device's default mail app (works on phones)
    if(mailtoOK){ eBtn.dataset.href=mailtoURL; eBtn.onclick=()=>{ markSent(); window.location.href=mailtoURL; }; }
    else { eBtn.dataset.href=mailtoShort; eBtn.onclick=()=>{
      if(!syncCopy(msg)) return manualCopy();
      markSent(); copiedNote(); window.location.href=mailtoShort;
    }; }
    // 2026-08-20 (Justin's ask): pressing "✓ Send to my Coordinator" opens the
    // email app DIRECTLY, pre-addressed to the coordinator — no second tap.
    // Runs moments after the Send tap, inside the browser's transient-activation
    // window. The panel stays behind it as the fallback (Gmail / Copy) for
    // devices with no mail app; encryption failure never reaches this line.
    eBtn.onclick();
  }).catch(()=>{
    // Never fall back to sending plaintext silently.
    const err=document.getElementById("sendErr");
    err.textContent=X("Encryption isn't available in this browser, so the send buttons are off. Please call your coordinator, or simply share your answers at the meeting.","El cifrado no está disponible en este navegador, así que los botones de envío están apagados. Llame a su coordinador, o simplemente comparta sus respuestas en la reunión.");
    err.classList.remove("ok"); err.style.display="block";
  });
  fb.scrollIntoView({behavior:"smooth"});
}

/* ═══════════════════════════════════════════════════════════════════
   5) Values, persistence, utils
   ═══════════════════════════════════════════════════════════════════ */
function fmtDate(v){
  if(!v) return "";
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);   // native date input → MM/DD/YYYY
  return m ? `${m[2]}/${m[3]}/${m[1]}` : String(v);
}
function displayVal(f){
  const v=data[f.key];
  if(f.type==="date") return fmtDate(v);
  if(f.type==="chips"||f.type==="dropdown"){ const a=toArr(v); return a.join(", "); }
  if(f.type==="select"){ return (toArr(v)[0]||"").toString().trim(); }
  if(f.type==="engrave"){
    const checked=engraveChecked(f.key); const parts=[];
    if(checked.includes("name")){ const x=engraveAuto("name"); if(x) parts.push("Name: "+x); }
    if(checked.includes("diagnosis")){ const x=engraveAuto("diagnosis"); if(x) parts.push("Diagnosis: "+x); }
    if(checked.includes("allergies")){ const x=engraveAuto("allergies"); if(x) parts.push("Allergies: "+x); }
    const phone=(data.medic_alert_phone||"").trim(); if(phone) parts.push("Emergency phone: "+phone);
    return parts.join("; ");
  }
  if(f.type==="repeat"){
    const arr=Array.isArray(v)?v:[];
    if(f.repeatKind==="med") return arr.filter(r=>r.name).map(r=>`${r.name}${r.dose?` — ${r.dose}`:""}`).join("\n");
    return arr.filter(r=>r.name).map(r=>`${r.name}${r.rel?` (${r.rel})`:""}${r.phone?` — ${r.phone}`:""}`).join("\n");
  }
  if(f.type==="specialists"){
    // canonical for the coordinator: English type + numeric month/year (language-neutral)
    const arr=Array.isArray(v)?v:[];
    return arr.filter(r=>(r.type||r.name)).map(r=>{
      let s=r.type||"";
      if(r.name) s+=(s?" — ":"")+r.name;
      if(r.month&&r.year) s+=` — ${r.month}/${r.year}`;
      else if(r.year) s+=` — ${r.year}`;
      else if(r.month) s+=` — ${MONTHS.en[+r.month-1]||r.month}`;   // month picked, year left blank
      return s;
    }).join("\n");
  }
  return (v||"").toString().trim();
}

/* Review-screen display: same answers, but option labels and month names in the
   family's language. The payload/summary keep displayVal's canonical values. */
function displayValLoc(f){
  if(f.type==="chips"||f.type==="dropdown") return toArr(data[f.key]).map(v=>locOptLabel(f,v)).join(", ");
  if(f.type==="select"){ const v=(toArr(data[f.key])[0]||"").toString().trim(); return v?locOptLabel(f,v):""; }
  if(f.type==="specialists"){
    const arr=Array.isArray(data[f.key])?data[f.key]:[];
    const months=MONTHS[lang]||MONTHS.en;
    return arr.filter(r=>(r.type||r.name)).map(r=>{
      let s=r.type?locOptLabel(f,r.type):"";
      if(r.name) s+=(s?" — ":"")+r.name;
      if(r.month&&r.year) s+=` — ${months[+r.month-1]||r.month} ${r.year}`;
      else if(r.year) s+=` — ${r.year}`;
      else if(r.month) s+=` — ${months[+r.month-1]||r.month}`;
      return s;
    }).join("\n");
  }
  return displayVal(f);
}
function toArr(v){ return Array.isArray(v)?v:(v?[v]:[]); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hasDraft(){ return Object.keys(data).some(k=>k!=="__step"&&data[k]&&(Array.isArray(data[k])?data[k].length:true)); }
function firstUnansweredStep(){
  // Resume where the family left off: the saved step if valid, else the
  // furthest step that already has any answer, else the first step.
  if (typeof data.__step === "number" && data.__step >= 0 && data.__step <= STEPS.length) return data.__step;
  let last = 0;
  STEPS.forEach((s,i)=>{ if (s.fields.some(f=>{ const v=data[f.key]; return v && (Array.isArray(v)?v.length:true); })) last = i; });
  return last;
}

let saveT;
function persist(light){
  if(idx>=0) data.__step=idx;   // never record the welcome screen — keeps exact-step resume
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ LS.set(SAVE_KEY,JSON.stringify(data)); if(!light) flashSaved(); }, light?350:0);
}
// The debounce above leaves a 0–350ms window where typing followed immediately by a
// reload/close would lose the last keystrokes. Flush synchronously on the way out.
window.addEventListener("pagehide",()=>{ try{ clearTimeout(saveT); if(Object.keys(data).length) LS.set(SAVE_KEY,JSON.stringify(data)); }catch(e){} });
function flashSaved(){
  const e=document.getElementById("savedPill"); if(!e) return;
  e.textContent = (X("✓ Saved on this device","✓ Guardado en este dispositivo"));
  e.classList.add("show"); clearTimeout(flashSaved._t);
  flashSaved._t=setTimeout(()=>e.classList.remove("show"),1500);
}
function clearDraft(){ LS.remove(SAVE_KEY); }

/* ── Lang + theme ── */
function setLang(l){ lang=l; LS.set(SAVE_KEY+"_lang",l); document.documentElement.lang=l;
  document.getElementById("langBtn").textContent = "🌐 " + langName(l);
  document.title = "VMRC \u2014 " + tx(T.formTitle);
  closeLangMenu(); render(); }
function closeLangMenu(){ const m=document.getElementById("langMenu"); if(m) m.remove(); }
document.getElementById("langBtn").onclick=()=>{
  if(document.getElementById("langMenu")){ closeLangMenu(); return; }
  const m=document.createElement("div"); m.id="langMenu"; m.className="langmenu"; m.setAttribute("role","menu");
  m.innerHTML = LANGS.map(L=>`<button type="button" role="menuitem" class="lm ${L.c===lang?"on":""}" data-lm="${L.c}">${L.f?L.f+" ":""}${L.n}</button>`).join("");
  document.querySelector(".bar").appendChild(m);
  m.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>setLang(b.dataset.lm));
  document.addEventListener("click", function h(ev){
    if(!m.contains(ev.target) && !ev.target.closest("#langBtn")){ closeLangMenu(); document.removeEventListener("click",h,{capture:true}); }
  }, {capture:true});
};

function setTheme(t){ document.documentElement.setAttribute("data-theme",t); LS.set(SAVE_KEY+"_theme",t);
  document.getElementById("themeBtn").textContent = t==="dark"?"☀️":"🌙"; }
document.getElementById("themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
setTheme(LS.get(SAVE_KEY+"_theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
function setBig(on){ document.documentElement.classList.toggle("big",!!on); LS.set(SAVE_KEY+"_big",on?"1":"0");
  const b=document.getElementById("bigBtn"); if(b){ b.classList.toggle("on",!!on); b.setAttribute("aria-pressed",on?"true":"false"); } }
document.getElementById("bigBtn").onclick=()=>setBig(!document.documentElement.classList.contains("big"));
setBig(LS.get(SAVE_KEY+"_big")==="1");
document.getElementById("langBtn").textContent = "🌐 " + langName(lang);
document.documentElement.lang = lang;

// medication autocomplete source
(function(){ const dl=document.createElement("datalist"); dl.id="medlist";
  MED_LIST.forEach(m=>{ const o=document.createElement("option"); o.value=m.name; dl.appendChild(o); });
  document.body.appendChild(dl);
})();

// close any open dropdown when tapping elsewhere
document.addEventListener("click",()=>closeAllDropdowns());

// Keyboard activation for div-based tap targets (chips & language picker):
// Enter or Space triggers the same handler as a click, so the form is fully
// usable without a mouse / touch.
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t && t.classList && t.classList.contains("chip") && (e.key==="Enter"||e.key===" "||e.key==="Spacebar")){
    e.preventDefault(); t.click();
  }
});

try { render(); }
catch(err){
  try { document.getElementById("stage").innerHTML =
    '<div style="margin:18px;padding:16px;border:2px solid #c0392b;border-radius:12px;'
    + 'background:#fdecea;color:#7a1f17;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap">'
    + '⚠️ The form hit an error:\n\n' + (err && err.message) + '\n\n' + ((err && err.stack)||'')
    + '\n\nScreenshot this and send it to your coordinator.</div>'; } catch(_){}
}

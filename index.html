<style>
  :root{
    /* ── Monochrome system, matched to the VMRC IPP SC Toolkit ── */
    --topbar:#0c0d10; --topbar-tx:#f4f5f7;
    --accent:#111114; --accent-2:#26272b; --on-accent:#ffffff; --accent-soft:#f0f0f2;
    --bg:#f5f5f6; --card:#ffffff; --ink:#0c0d10; --muted:#52555c;
    --line:#e6e6e9; --field:#ffffff; --fieldline:#dcdce0;
    --chip:#f0f0f2; --chipline:#e6e6e9; --chipink:#111114;
    --shadow:0 1px 2px rgba(11,12,15,.05),0 10px 34px rgba(11,12,15,.09);
    --bub:#ffffff; --good:#16a34a;
    /* legacy names mapped onto the system above so existing rules keep working */
    --navy:var(--topbar); --navy-d:#070809; --navy-dd:#000000;
    --cyan:#e8eaee; --green:var(--accent); --green-d:var(--accent-2); --amber:#c2710c;
  }
  [data-theme="dark"]{
    --topbar:#000000; --topbar-tx:#f4f5f7;
    --accent:#f4f5f7; --accent-2:#d4d6da; --on-accent:#0a0b0d; --accent-soft:#1f2227;
    --bg:#0a0b0d; --card:#141518; --ink:#f4f5f7; --muted:#aeb2bb;
    --line:#262931; --field:#1a1c20; --fieldline:#2a2d34;
    --chip:#1f2227; --chipline:#2a2d34; --chipink:#e8eaee;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
    --bub:#141518; --good:#34d399;
    --navy:#000000; --navy-d:#070809; --navy-dd:#000000;
    --cyan:#e8eaee; --green:var(--accent); --green-d:var(--accent-2); --amber:#fbbf24;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    display:flex; flex-direction:column; min-height:100%;
    transition:background .3s,color .3s;
  }

  /* ── Top bar ── */
  .bar{
    background:linear-gradient(135deg,var(--navy),var(--navy-d));
    color:#fff; padding:13px 16px; position:sticky; top:0; z-index:30;
    box-shadow:0 2px 14px rgba(0,0,0,.28);
  }
  .bar-row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .bar .org{font-size:10px;letter-spacing:.12em;color:var(--cyan);font-weight:800;text-transform:uppercase}
  .bar .ttl{font-size:15.5px;font-weight:800;line-height:1.15}
  .bar .spacer{flex:1}

  .bar-title{font-size:15px;font-weight:800;color:#fff;line-height:1.15}
  .iconbtn{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);color:#fff;
    border-radius:30px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;
  }
  .iconbtn:hover{background:rgba(255,255,255,.22)}
  /* progress */
  .progwrap{max-width:640px;margin:9px auto 0}
  .prog{height:7px;background:rgba(255,255,255,.22);border-radius:5px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:var(--cyan);border-radius:5px;transition:width .35s}
  .progtxt{font-size:11px;color:var(--cyan);margin-top:4px;font-weight:600}
  /* segmented step bar — click anywhere along it to jump to that step */
  .segwrap{max-width:640px;margin:10px auto 0}
  .segbar{display:flex;gap:3px}
  .segbar .seg{flex:1;min-width:0;height:32px;border:none;background:rgba(255,255,255,.14);
    color:rgba(255,255,255,.72);border-radius:6px;font-size:12.5px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;transition:.15s}
  .segbar .seg:hover{background:rgba(255,255,255,.30);color:#fff}
  .segbar .seg.done{background:rgba(255,255,255,.42);color:#0c0d10}
  .segbar .seg.active{background:#ffffff;color:#0c0d10;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
  .seglabel{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--cyan);font-weight:700;margin-top:7px}
  .pbar{height:6px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;margin-top:9px}
  .pbar>i{display:block;height:100%;width:0;background:var(--cyan);border-radius:99px;transition:width .35s ease}
  .savedpill{display:flex;justify-content:center;font-size:11.5px;color:var(--cyan);font-weight:700;margin-top:6px;opacity:0;transform:translateY(-2px);transition:opacity .2s,transform .2s;pointer-events:none}
  .savedpill.show{opacity:1;transform:none}
  .iconbtn.on{background:rgba(255,255,255,.30)}
  html.big body{zoom:1.18}
  html.big .chip{padding:12px 22px}
  html.big .hint{font-weight:600}
  html.big input,html.big textarea,html.big select{border-width:2px}

  /* ── Stage ── */
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:18px 16px 26px}
  .step{display:none;animation:fade .35s ease}
  .step.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .intro{
    display:flex;gap:11px;align-items:flex-start;background:var(--bub);
    border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:14px;border-top-left-radius:5px;padding:13px 15px;margin-bottom:6px;
    box-shadow:0 2px 10px rgba(20,40,70,.05);
  }
  .intro .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(20,40,70,.18)}
  .intro .av svg{display:block}
  .rev-ic{display:inline-flex;align-items:center;gap:7px}
  .ic{flex:none}
  .intro h2{font-size:17px;margin-bottom:2px}
  .intro p{font-size:13.5px;color:var(--muted)}

  .field{margin-top:16px}
  .field > label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
  .field .hint{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:-3px;margin-bottom:7px}
  .opt{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--chip);border:1px solid var(--chipline);
       border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{
    width:100%;background:var(--field);color:var(--ink);
    border:1.5px solid var(--fieldline);border-radius:11px;
    padding:12px 13px;font-size:15px;font-family:inherit;transition:.15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(17,17,20,.12)}
  textarea{min-height:78px;resize:vertical;line-height:1.45}
  ::placeholder{color:var(--muted);opacity:.7}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    background:var(--chip);border:1.5px solid var(--chipline);color:var(--chipink);
    border-radius:22px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;
    transition:.12s;user-select:none;display:flex;align-items:center;gap:6px;
  }
  .chip:hover{transform:translateY(-1px)}
  .chip.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
  .chip.on::before{content:"✓";font-weight:900}
  .chip.none.on{background:var(--accent);border-color:var(--accent)}

  /* repeat rows (meds / contacts) */
  .repeat{margin-top:6px}
  .rrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .rrow input{flex:1 1 120px;min-width:0}
  .rrow .del{flex:none;width:44px;height:44px;border-radius:10px;border:none;
    background:#fdecea;color:#c0392b;font-size:20px;font-weight:800;line-height:1;cursor:pointer;transition:.12s}
  .rrow .del:hover{background:#c0392b;color:#fff}
  [data-theme="dark"] .rrow .del{background:#3a2226;color:#ff8a80}
  [data-theme="dark"] .rrow .del:hover{background:#c0392b;color:#fff}
  .addbtn{margin-top:9px;background:none;border:1.5px dashed var(--accent);color:var(--accent);
    border-radius:11px;padding:10px;width:100%;font-size:14px;font-weight:700;cursor:pointer}
  [data-theme="dark"] .addbtn{color:var(--cyan)}

  /* dose ▲▼ stepper (±10, still hand-editable) */
  .dosewrap{display:flex;gap:5px;flex:1 1 170px;min-width:0;align-items:center}
  .dosewrap input{flex:1 1 90px;min-width:0}
  .dosebtn{flex:none;width:42px;height:44px;border-radius:10px;border:1.5px solid var(--fieldline);
    background:var(--field);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;transition:.12s}
  .dosebtn:hover{border-color:var(--accent);color:var(--accent)}
  [data-theme="dark"] .dosebtn:hover{color:var(--cyan);border-color:var(--cyan)}

  /* specialists: card per selected specialist (name + last-visit month/year) */
  .sp-list{margin-top:4px}

// Safe localStorage. Apps Script serves the form in a sandboxed iframe where
// storage access can THROW (esp. Incognito / third-party storage blocked).
// Wrapping it means a failure just disables auto-save instead of halting the
// whole script (which had left the page blank except the static header).
const LS = (function(){
  var store=null; try{ store=window.localStorage; }catch(e){}
  return {
    get:function(k){ try{ return store?store.getItem(k):null; }catch(e){ return null; } },
    set:function(k,v){ try{ if(store) store.setItem(k,v); }catch(e){} },
    remove:function(k){ try{ if(store) store.removeItem(k); }catch(e){} }
  };
})();

{ const _ul=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();

please double-check the name and dose against the bottle.":"Đã thêm — vui lòng kiểm tra lại tên và liều lượng với chai thuốc.","We couldn't read that label. Try a closer, well-lit photo of the biggest words — or type it in.":"Không đọc được nhãn đó. Hãy thử chụp gần hơn, đủ sáng vào chữ lớn nhất — hoặc gõ vào.","Found on the card: {0} — selected it for you. Please double-check.":"Tìm thấy trên thẻ: {0} — đã chọn giúp quý vị. Vui lòng kiểm tra lại.","We couldn't recognize the plan on that card. Try a straight, well-lit photo of the front — or tap the choices above.":"Không nhận ra được chương trình bảo hiểm trên thẻ đó. Hãy thử chụp thẳng, đủ sáng mặt trước — hoặc bấm các lựa chọn ở trên.","Done — what should I bring to the meeting?":"Xong — tôi nên mang gì đến buổi họp?","Speak instead of typing":"Nói thay vì gõ chữ","Sorry — no {0} voice is installed on this device, so read-aloud isn't available.":"Xin lỗi — thiết bị này chưa cài giọng đọc {0}, nên chưa đọc to được.","Voice typing uses your device's speech service — what you say may be sent to Google or Apple to turn it into text. Don't say anything you want to keep fully private. Use voice typing?":"Gõ bằng giọng nói dùng dịch vụ nhận dạng giọng của thiết bị — lời quý vị nói có thể được gửi đến Google hoặc Apple để chuyển thành chữ. Đừng nói điều gì quý vị muốn giữ hoàn toàn riêng tư. Dùng gõ bằng giọng nói?","Listening… speak now, then pause.":"Đang nghe… hãy nói ngay, rồi ngừng một chút.","Voice typing didn't work here — you can use the microphone button on your keyboard instead.":"Gõ bằng giọng nói không hoạt động ở đây — quý vị có thể dùng nút micro trên bàn phím.","Want to pick the meeting time yourself? Choose a time that works for you — online or in person.":"Quý vị muốn tự chọn giờ họp? Hãy chọn giờ thuận tiện cho quý vị — trực tuyến hoặc gặp trực tiếp.","Pick a meeting time":"Chọn giờ họp","This form is a preparation worksheet provided by your Service Coordinator, {0}. It is not an official VMRC records system.":"Mẫu đơn này là một phiếu chuẩn bị do Điều phối viên Dịch vụ của quý vị, {0}, cung cấp. Đây không phải là hệ thống hồ sơ chính thức của VMRC.","Your answers are private and saved only on this device until you press Send. When you send them, they go to your Service Coordinator's email encrypted.":"Câu trả lời của quý vị được giữ riêng tư và chỉ lưu trên thiết bị này cho đến khi quý vị bấm Gửi. Khi quý vị gửi, chúng được mã hóa và gửi đến email của Điều phối viên Dịch vụ của quý vị.","Your answers stay on this device while you fill out the form. When you finish, you send them to your Service Coordinator by email using your own email app. The message you send is encrypted so only your Service Coordinator can read it. This form is designed to protect your private health information, consistent with privacy laws, including HIPAA.":"Câu trả lời của quý vị vẫn ở trên thiết bị này trong khi quý vị điền mẫu đơn. Khi hoàn tất, quý vị gửi chúng cho Điều phối viên Dịch vụ của quý vị qua email bằng ứng dụng email của mình. Tin nhắn quý vị gửi được mã hóa để chỉ Điều phối viên Dịch vụ của quý vị mới đọc được. Mẫu đơn này được thiết kế để bảo vệ thông tin sức khỏe riêng tư của quý vị, phù hợp với các luật về quyền riêng tư, bao gồm HIPAA.","Meeting intake form (encrypted)":"Mẫu đơn chuẩn bị cuộc họp (đã mã hóa)","This message is encrypted for your Service Coordinator. Please send it exactly as it is — do not edit it.":"Tin nhắn này đã được mã hóa cho Điều phối viên Dịch vụ của quý vị. Vui lòng gửi nguyên như vậy — đừng chỉnh sửa.","Check your summary below, then send it to your coordinator. <b>Copy and the email buttons send a locked (encrypted) message that only your coordinator can open.<\/b> This form itself sends nothing over the internet.":"Xem lại bản tóm tắt bên dưới, rồi gửi cho điều phối viên của quý vị. <b>Nút Sao chép và các nút email gửi một tin nhắn đã khóa (mã hóa) mà chỉ điều phối viên của quý vị mới mở được.<\/b> Bản thân mẫu đơn này không gửi gì lên internet.","Encryption isn't available in this browser, so the send buttons are off. Please call your coordinator, or simply share your answers at the meeting.":"Trình duyệt này không hỗ trợ mã hóa, nên các nút gửi đã tắt. Vui lòng gọi cho điều phối viên của quý vị, hoặc chia sẻ câu trả lời của quý vị tại cuộc họp.","Copying didn't work on this device. The message is selected below — press and hold (or Ctrl+C) to copy it, then paste it into an email.":"Không thể sao chép trên thiết bị này. Tin nhắn đã được chọn sẵn bên dưới — nhấn giữ (hoặc Ctrl+C) để sao chép, rồi dán vào email.","If you already sent your answers to <b>{0}<\/b>, they'll review everything before your IPP meeting. If not, no problem — you can share your answers at the meeting.":"Nếu quý vị đã gửi câu trả lời cho <b>{0}<\/b>, họ sẽ xem xét mọi thứ trước cuộc họp IPP của quý vị. Nếu chưa, không sao — quý vị có thể chia sẻ câu trả lời tại cuộc họp.","Know your meeting date? Put it in your phone's calendar with gentle reminders — one week before and the day before. The event says only “Family meeting” — no names or private details.":"Đã biết ngày họp? Hãy đưa vào lịch điện thoại của quý vị với lời nhắc nhẹ nhàng — một tuần trước và một ngày trước. Sự kiện chỉ ghi “Cuộc họp gia đình” — không có tên hay chi tiết riêng tư.","Meeting date":"Ngày họp","Time (optional)":"Giờ (không bắt buộc)","Add to my calendar":"Thêm vào lịch của tôi","Added — your calendar app should open now":"Đã thêm — ứng dụng lịch của quý vị sẽ mở ngay","Family meeting":"Cuộc họp gia đình","Get ready: bring medicine bottles, insurance cards, and any questions you want to ask.":"Chuẩn bị: mang theo các lọ thuốc, thẻ bảo hiểm và những câu hỏi quý vị muốn hỏi.","Family meeting in one week — time to get ready":"Còn một tuần nữa đến cuộc họp gia đình — đến lúc chuẩn bị","Family meeting tomorrow":"Ngày mai là cuộc họp gia đình","Increase the dose by 10":"Tăng liều lượng thêm 10","Decrease the dose by 10":"Giảm liều lượng đi 10","Doctor's name":"Tên il you press Send. When you send them, they go to your Service Coordinator's email encrypted.":"Pribado po ang inyong mga sagot at naka-save lamang sa device na ito hanggang sa pindutin ninyo ang Ipadala. Kapag ipinadala ninyo, naka-encrypt ang mga ito papunta sa email ng inyong Service Coordinator.","Your answers stay on this device while you fill out the form. When you finish, you send them to your Service Coordinator by email using your own email app. The message you send is encrypted so only your Service Coordinator can read it. This form is designed to protect your private health information, consistent with privacy laws, including HIPAA.":"Nananatili ang inyong mga sagot sa device na ito habang sinasagutan ninyo ang form. Kapag tapos na, ipapadala ninyo ang mga ito sa inyong Service Coordinator sa pamamagitan ng email, gamit ang sarili ninyong email app. Naka-encrypt ang mensaheng ipinapadala ninyo kaya ang inyong Service Coordinator lamang ang makakabasa nito. Ang form na ito ay idinisenyo upang protektahan ang inyong pribadong impormasyong pangkalusugan, naaayon sa mga batas sa privacy, kabilang ang HIPAA.","Meeting intake form (encrypted)":"Form ng paghahanda sa miting (naka-encrypt)","This message is encrypted for your Service Coordinator. Please send it exactly as it is — do not edit it.":"Naka-encrypt ang mensaheng ito para sa inyong Service Coordinator. Ipadala ito nang eksaktong ganito — huwag itong i-edit.","Check your summary below, then send it to your coordinator. <b>Copy and the email buttons send a locked (encrypted) message that only your coordinator can open.<\/b> This form itself sends nothing over the internet.":"Suriin ang inyong buod sa ibaba, pagkatapos ay ipadala ito sa inyong coordinator. <b>Ang Kopyahin at ang mga email button ay nagpapadala ng naka-lock (naka-encrypt) na mensahe na ang inyong coordinator lamang ang makakapagbukas.<\/b> Ang form na ito mismo ay walang ipinapadala sa internet.","Encryption isn't available in this browser, so the send buttons are off. Please call your coordinator, or simply share your answers at the meeting.":"Hindi available ang encryption sa browser na ito, kaya naka-off ang mga send button. Tawagan po ang inyong coordinator, o ibahagi na lamang ang inyong mga sagot sa miting.","Copying didn't work on this device. The message is selected below — press and hold (or Ctrl+C) to copy it, then paste it into an email.":"Hindi gumana ang pagkopya sa device na ito. Naka-select na ang mensahe sa ibaba — pindutin nang matagal (o Ctrl+C) para kopyahin, pagkatapos ay i-paste sa email.","If you already sent your answers to <b>{0}<\/b>, they'll review everything before your IPP meeting. If not, no problem — you can share your answers at the meeting.":"Kung naipadala na ninyo ang inyong mga sagot kay <b>{0}<\/b>, susuriin niya ang lahat bago ang inyong IPP meeting. Kung hindi pa, ayos lang — maaari ninyong ibahagi ang inyong mga sagot sa miting.","Know your meeting date? Put it in your phone's calendar with gentle reminders — one week before and the day before. The event says only “Family meeting” — no names or private details.":"Alam na ang petsa ng miting? Ilagay ito sa calendar ng inyong telepono na may banayad na paalala — isang linggo bago at isang araw bago. Ang event ay nagsasabi lamang ng “Miting ng pamilya” — walang pangalan o pribadong detalye.","Meeting date":"Petsa ng miting","Time (optional)":"Oras (opsyonal)","Add to my calendar":"Idagdag sa aking calendar","Added — your calendar app should open now":"Naidagdag na — bubukas na dapat ang inyong calendar app","Family meeting":"Miting ng pamilya","Get ready: bring medicine bottles, insurance cards, and any questions you want to ask.":"Maghanda: dalhin ang mga bote ng gamot, insurance card, at anumang tanong na gusto ninyong itanong.","Family meeting in one week — time to get ready":"Isang linggo na lang bago ang miting ng pamilya — oras na para maghanda","Family meeting tomorrow":"Bukas na ang miting ng pamilya","Incr l":"ਈਮੇਲ","Get to know them":"ਉਹਨਾਂ ਨੂੰ ਜਾਣੋ","This helps us write a plan that's truly about them — not just services.":"ਇਸ ਨਾਲ ਅਸੀਂ ਇੱਕ ਅਜਿਹੀ ਯੋਜਨਾ ਬਣਾ ਸਕਦੇ ਹਾਂ ਜੋ ਸੱਚਮੁੱਚ ਉਹਨਾਂ ਬਾਰੇ ਹੋਵੇ — ਸਿਰਫ਼ ਸੇਵਾਵਾਂ ਬਾਰੇ ਨਹੀਂ।","What do they enjoy? Hobbies, interests, favorite things":"ਉਹਨਾਂ ਨੂੰ ਕੀ ਪਸੰਦ ਹੈ? ਸ਼ੌਕ, ਦਿਲਚਸਪੀਆਂ, ਮਨਪਸੰਦ ਚੀਜ਼ਾਂ","e.g. painting, sports, animals, movies…":"ਜਿਵੇਂ ਚਿੱਤਰਕਾਰੀ, ਖੇਡਾਂ, ਜਾਨਵਰ, ਫ਼ਿਲਮਾਂ…","What do people like & admire about them?":"ਲੋਕ ਉਹਨਾਂ ਦੀ ਕਿਹੜੀ ਗੱਲ ਪਸੰਦ ਕਰਦੇ ਹਨ ਤੇ ਕਿਸ ਗੱਲ ਦੀ ਕਦਰ ਕਰਦੇ ਹਨ?","Their best qualities…":"ਉਹਨਾਂ ਦੇ ਸਭ ਤੋਂ ਚੰਗੇ ਗੁਣ…","What are their hopes for this year?":"ਇਸ ਸਾਲ ਲਈ ਉਹਨਾਂ ਦੀਆਂ ਕੀ ਉਮੀਦਾਂ ਹਨ?","Goals, things they'd like to do or learn…":"ਟੀਚੇ, ਉਹ ਚੀਜ਼ਾਂ ਜੋ ਉਹ ਕਰਨਾ ਜਾਂ ਸਿੱਖਣਾ ਚਾਹੁੰਦੇ ਹਨ…","Bigger picture — where do they want to live, work, or be in the community?":"ਵੱਡੀ ਤਸਵੀਰ — ਉਹ ਕਿੱਥੇ ਰਹਿਣਾ, ਕੰਮ ਕਰਨਾ ਜਾਂ ਭਾਈਚਾਰੇ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਣਾ ਚਾਹੁੰਦੇ ਹਨ?","Long-term vision…":"ਲੰਬੇ ਸਮੇਂ ਦੀ ਸੋਚ…","How they communicate":"ਉਹ ਕਿਵੇਂ ਗੱਲਬਾਤ ਕਰਦੇ ਹਨ","So everyone on the team knows the best way to connect with them.":"ਤਾਂ ਜੋ ਟੀਮ ਦੇ ਹਰ ਮੈਂਬਰ ਨੂੰ ਪਤਾ ਹੋਵੇ ਕਿ ਉਹਨਾਂ ਨਾਲ ਜੁੜਨ ਦਾ ਸਭ ਤੋਂ ਵਧੀਆ ਤਰੀਕਾ ਕੀ ਹੈ।","How do they communicate? (tap all that apply)":"ਉਹ ਕਿਵੇਂ ਗੱਲਬਾਤ ਕਰਦੇ ਹਨ? (ਜੋ ਵੀ ਲਾਗੂ ਹੋਵੇ, ਸਭ 'ਤੇ ਟੈਪ ਕਰੋ)","Talks in sentences":"ਪੂਰੇ ਵਾਕਾਂ ਵਿੱਚ ਬੋਲਦੇ ਹਨ","A few words":"ਕੁਝ ਸ਼ਬਦ","Gestures / pointing":"ਇਸ਼ਾਰੇ / ਉਂਗਲ ਨਾਲ ਦੱਸਣਾ","Device / app":"ਡਿਵਾਈਸ / ਐਪ","Sign language":"ਸੈਨਤ ਭਾਸ਼ਾ (ਸਾਈਨ ਲੈਂਗੂਏਜ)","Sounds / expressions":"ਆਵਾਜ਼ਾਂ / ਹਾਵ-ਭਾਵ","What helps when talking with them?":"ਉਹਨਾਂ ਨਾਲ ਗੱਲ ਕਰਨ ਵੇਲੇ ਕੀ ਮਦਦ ਕਰਦਾ ਹੈ?","Words they use, what to do/avoid…":"ਉਹ ਕਿਹੜੇ ਸ਼ਬਦ ਵਰਤਦੇ ਹਨ, ਕੀ ਕਰਨਾ ਹੈ/ਕਿਸ ਤੋਂ ਬਚਣਾ ਹੈ…","Health & medications":"ਸਿਹਤ ਅਤੇ ਦਵਾਈਆਂ","The most important section. This keeps them safe and helps us plan their care.":"ਸਭ ਤੋਂ ਜ਼ਰੂਰੀ ਹਿੱਸਾ। ਇਹ ਉਹਨਾਂ ਨੂੰ ਸੁਰੱਖਿਅਤ ਰੱਖਦਾ ਹੈ ਅਤੇ ਉਹਨਾਂ ਦੀ ਦੇਖਭਾਲ ਦੀ ਯੋਜਨਾ ਬਣਾਉਣ ਵਿੱਚ ਸਾਡੀ ਮਦਦ ਕਰਦਾ ਹੈ।","Diagnoses or conditions":"ਬੀਮਾਰੀਆਂ ਜਾਂ ਹਾਲਤਾਂ (ਡਾਇਗਨੋਸਿਸ)","Tap to open the list and check all that apply — or add your own.":"ਸੂਚੀ ਖੋਲ੍ਹਣ ਲਈ ਟੈਪ ਕਰੋ ਅਤੇ ਜੋ ਵੀ ਲਾਗੂ ਹੋਵੇ, ਸਭ ਚੁਣੋ — ਜਾਂ ਆਪਣਾ ਸ਼ਾਮਲ ਕਰੋ।","Autism Spectrum Disorder":"ਔਟਿਜ਼ਮ (Autism Spectrum Disorder)","Intellectual Disability":"ਬੌਧਿਕ ਅਪੰਗਤਾ (Intellectual Disability)","Down Syndrome":"ਡਾਊਨ ਸਿੰਡਰੋਮ (Down Syndrome)","Cerebral Palsy":"ਸੈਰੀਬ੍ਰਲ ਪਾਲਸੀ (Cerebral Palsy)","Epilepsy / Seizures":"ਮਿਰਗੀ / ਦੌਰੇ","ADHD":"ADHD (ਧਿਆਨ ਟਿਕਾਉਣ ਵਿੱਚ ਮੁਸ਼ਕਲ)","Anxiety":"ਚਿੰਤਾ ਦਾ ਰੋਗ (ਐਂਗਜ਼ਾਇਟੀ)","Depression":"ਡਿਪਰੈਸ਼ਨ (ਉਦਾਸੀ ਦਾ ਰੋਗ)","Bipolar Disorder":"ਬਾਈਪੋਲਰ ਡਿਸਆਰਡਰ (Bipolar)","Asthma":"ਦਮਾ (ਅਸਥਮਾ)","Diabetes":"ਸ਼ੂਗਰ (ਡਾਇਬੀਟੀਜ਼)","Fragile X Syndrome":"ਫ੍ਰੈਜਾਇਲ X ਸਿੰਡਰੋਮ (Fragile X)","Hearing Impairment":"ਸੁਣਨ ਵਿੱਚ ਕਮਜ਼ੋਰੀ","Vision Impairment":"ਨਜ਼ਰ ਵਿੱਚ ਕਮਜ਼ੋਰੀ","Any allergies? (food or medicine)":"ਕੋਈ ਐਲਰਜੀ? (ਖਾਣੇ ਜਾਂ ਦਵਾਈ ਤੋਂ)","None / No known allergies":"ਕੋਈ ਨਹੀਂ / ਕੋਈ ਐਲਰਜੀ ਪਤਾ ਨਹੀਂ","Yes — list below":"ਹਾਂ — ਹੇਠਾਂ ਲਿਖੋ","What are they allergic to?":"ਉਹਨਾਂ ਨੂੰ ਕਿਸ ਚੀਜ਼ ਤੋਂ ਐਲਰਜੀ ਹੈ?","List allergies and reactions":"ਐਲਰਜੀਆਂ ਅਤੇ ਉਹਨਾਂ ਦੇ ਅਸਰ ਲਿਖੋ","Current medications":"ਮੌਜੂਦਾ ਦਵਾਈਆਂ","Tip: grab their medicine bottles before you start — the label shows the exact name and dose.":"ਸੁਝਾਅ: ਸ਼ੁਰੂ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਉਹਨਾਂ ਦੀਆਂ ਦਵਾਈਆਂ ਦੀਆਂ ਸ਼ੀਸ਼ੀਆਂ ਕੋਲ ਰੱਖ ਲਓ — ਲੇਬਲ 'ਤੇ ਦਵਾਈ ਦਾ ਸਹੀ ਨਾਮ ਅਤੇ ਖ਼ੁਰਾਕ ਲਿਖੀ ਹੁੰਦੀ ਹੈ।","Start typing to pick from common medications — a typical dose fills in automatically (you can change it). Tap + to add more, or type any medication.":"ਆਮ ਦਵਾਈਆਂ ਵਿੱਚੋਂ ਚੁਣਨ ਲਈ ਲਿਖਣਾ ਸ਼ੁਰੂ ਕਰੋ — ਆਮ ਖ਼ੁਰਾਕ ਆਪਣੇ ਆਪ ਭਰ ਜਾਂਦੀ ਹੈ (ਤੁਸੀਂ ਇਸਨੂੰ ਬਦਲ ਸਕਦੇ ਹੋ)। ਹੋਰ ਸ਼ਾਮਲ ਕਰਨ ਲਈ + ਟੈਪ ਕਰੋ, ਜਾਂ ਕੋਈ ਵੀ ਦਵਾਈ ਲਿਖੋ।","Primary doctor — name & phone":"ਮੁੱਖ ਡਾਕਟਰ — ਨਾਮ ਅਤੇ ਫ਼ੋਨ","Dr. name, clinic, phone":"ਡਾਕਟਰ ਦਾ ਨਾਮ, ਕਲੀਨਿਕ, ਫ਼ੋਨ","Last doctor visit (about when?)":"ਡਾਕਟਰ ਕੋਲ ਆਖਰੀ ਵਾਰ ਕਦੋਂ ਗਏ? (ਲਗਭਗ)","This year":"ਇਸ ਸਾਲ","About 6 months ago":"ਲਗਭਗ 6 ਮਹੀਨੇ ਪਹਿਲਾਂ","Over a year ago":"ਇੱਕ ਸਾਲ ਤੋਂ ਵੱਧ ਪਹਿਲਾਂ","Other specialists they see":"ਹੋਰ ਮਾਹਿਰ ਡਾਕਟਰ ਜਿਨ੍ਹਾਂ ਕੋਲ ਉਹ ਜਾਂਦੇ ਹਨ","Dentist — name & last visit":"ਦੰਦਾਂ ਦਾ ਡਾਕਟਰ — ਨਾਮ ਅਤੇ ਆਖਰੀ ਮੁਲਾਕਾਤ",  ਬੋਲੋ","Sorry — no {0} voice is installed on this device, so read-aloud isn't available.":"ਮਾਫ਼ ਕਰਨਾ — ਇਸ ਡਿਵਾਈਸ ਵਿੱਚ {0} ਦੀ ਆਵਾਜ਼ ਇੰਸਟਾਲ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਉੱਚੀ ਪੜ੍ਹਨਾ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।","Voice typing uses your device's speech service — what you say may be sent to Google or Apple to turn it into text. Don't say anything you want to keep fully private. Use voice typing?":"ਆਵਾਜ਼ ਨਾਲ ਟਾਈਪਿੰਗ ਤੁਹਾਡੀ ਡਿਵਾਈਸ ਦੀ ਸਪੀਚ ਸੇਵਾ ਵਰਤਦੀ ਹੈ — ਜੋ ਤੁਸੀਂ ਕਹਿੰਦੇ ਹੋ ਉਹ ਟੈਕਸਟ ਬਣਾਉਣ ਲਈ Google ਜਾਂ Apple ਨੂੰ ਭੇਜਿਆ ਜਾ ਸਕਦਾ ਹੈ। ਕੁਝ ਵੀ ਅਜਿਹਾ ਨਾ ਕਹੋ ਜੋ ਤੁਸੀਂ ਪੂਰੀ ਤਰ੍ਹਾਂ ਨਿੱਜੀ ਰੱਖਣਾ ਚਾਹੁੰਦੇ ਹੋ। ਆਵਾਜ਼ ਨਾਲ ਟਾਈਪਿੰਗ ਵਰਤਣੀ ਹੈ?","Listening… speak now, then pause.":"ਸੁਣ ਰਿਹਾ ਹੈ… ਹੁਣ ਬੋਲੋ, ਫਿਰ ਥੋੜ੍ਹਾ ਰੁਕੋ।","Voice typing didn't work here — you can use the microphone button on your keyboard instead.":"ਆਵਾਜ਼ ਨਾਲ ਟਾਈਪਿੰਗ ਇੱਥੇ ਕੰਮ ਨਹੀਂ ਕੀਤੀ — ਤੁਸੀਂ ਆਪਣੇ ਕੀਬੋਰਡ ਦੇ ਮਾਈਕ੍ਰੋਫ਼ੋਨ ਬਟਨ ਦੀ ਵਰਤੋਂ ਕਰ ਸਕਦੇ ਹੋ।","Want to pick the meeting time yourself? Choose a time that works for you — online or in person.":"ਮੀਟਿੰਗ ਦਾ ਸਮਾਂ ਖ਼ੁਦ ਚੁਣਨਾ ਚਾਹੁੰਦੇ ਹੋ? ਜੋ ਸਮਾਂ ਤੁਹਾਨੂੰ ਠੀਕ ਲੱਗੇ, ਉਹ ਚੁਣੋ — ਆਨਲਾਈਨ ਜਾਂ ਆਹਮੋ-ਸਾਹਮਣੇ ਮਿਲ ਕੇ।","Pick a meeting time":"ਮੀਟਿੰਗ ਦਾ ਸਮਾਂ ਚੁਣੋ","This form is a preparation worksheet provided by your Service Coordinator, {0}. It is not an official VMRC records system.":"ਇਹ ਫਾਰਮ ਤਿਆਰੀ ਲਈ ਇੱਕ ਵਰਕਸ਼ੀਟ ਹੈ, ਜੋ ਤੁਹਾਡੇ ਸਰਵਿਸ ਕੋਆਰਡੀਨੇਟਰ, {0}, ਨੇ ਦਿੱਤੀ ਹੈ। ਇਹ VMRC ਦਾ ਅਧਿਕਾਰਤ ਰਿਕਾਰਡ ਸਿਸਟਮ ਨਹੀਂ ਹੈ।","Your answers are private and saved only on this device until you press Send. When you send them, they go to your Service Coordinator's email encrypted.":"ਤੁਹਾਡੇ ਜਵਾਬ ਨਿੱਜੀ ਹਨ ਅਤੇ ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ 'ਭੇਜੋ' ਨਹੀਂ ਦਬਾਉਂਦੇ, ਸਿਰਫ਼ ਇਸੇ ਡਿਵਾਈਸ 'ਤੇ ਸੰਭਾਲੇ ਰਹਿੰਦੇ ਹਨ। ਜਦੋਂ ਤੁਸੀਂ ਭੇਜਦੇ ਹੋ, ਤਾਂ ਇਹ ਇਨਕ੍ਰਿਪਟ (ਗੁਪਤ ਕੋਡ ਵਿੱਚ) ਹੋ ਕੇ ਤੁਹਾਡੇ ਸਰਵਿਸ ਕੋਆਰਡੀਨੇਟਰ ਦੀ ਈਮੇਲ 'ਤੇ ਜਾਂਦੇ ਹਨ।","Your answers stay on this device while you fill out the form. When you finish, you send them to your Service Coordinator by email using your own email app. The message you send is encrypted so only your Service Coordinator can read it. This form is designed to protect your private health information, consistent with privacy laws, including HIPAA.":"ਜਦੋਂ ਤੁਸੀਂ ਫਾਰਮ ਭਰ ਰਹੇ ਹੁੰਦੇ ਹੋ, ਤੁਹਾਡੇ ਜਵਾਬ ਇਸੇ ਡਿਵਾਈਸ 'ਤੇ ਹੀ ਰਹਿੰਦੇ ਹਨ। ਜਦੋਂ ਤੁਸੀਂ ਪੂਰਾ ਕਰ ਲੈਂਦੇ ਹੋ, ਤਾਂ ਤੁਸੀਂ ਇਹ ਜਵਾਬ ਆਪਣੀ ਈਮੇਲ ਐਪ ਵਰਤ ਕੇ ਈਮੇਲ ਰਾਹੀਂ ਆਪਣੇ ਸਰਵਿਸ ਕੋਆਰਡੀਨੇਟਰ ਨੂੰ ਭੇਜਦੇ ਹੋ। ਤੁਹਾਡਾ ਭੇਜਿਆ ਸੁਨੇਹਾ ਇਨਕ੍ਰਿਪਟ ਹੁੰਦਾ ਹੈ ਤਾਂ ਜੋ ਸਿਰਫ਼ ਤੁਹਾਡਾ ਸਰਵਿਸ ਕੋਆਰਡੀਨੇਟਰ ਹੀ ਇਸਨੂੰ ਪੜ੍ਹ ਸਕੇ। ਇਹ ਫਾਰਮ ਤੁਹਾਡੀ ਨਿੱਜੀ ਸਿਹਤ ਜਾਣਕਾਰੀ ਦੀ ਰੱਖਿਆ ਲਈ ਬਣਾਇਆ ਗਿਆ ਹੈ, ਜੋ HIPAA ਸਮੇਤ ਨਿੱਜਤਾ ਦੇ ਕਾਨੂੰਨਾਂ ਦੇ ਅਨੁਸਾਰ ਹੈ।","Meeting intake form (encrypted)":"ਮੀਟਿੰਗ ਦੀ ਤਿਆਰੀ ਦਾ ਫਾਰਮ (ਇਨਕ੍ਰਿਪਟ ਕੀਤਾ)","This message is encrypted for your Service Coordinator. Please send it exactly as it is — do not edit it.":"ਇਹ ਸੁਨੇਹਾ ਤੁਹਾਡੇ ਸਰਵਿਸ ਕੋਆਰਡੀਨੇਟਰ ਲਈ ਇਨਕ੍ਰਿਪਟ ਕੀਤਾ ਗਿਆ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਇਸਨੂੰ ਜਿਵੇਂ ਹੈ ਉਵੇਂ ਹੀ ਭੇਜੋ — ਇਸ ਵਿੱਚ ਕੋਈ ਤਬਦੀਲੀ ਨਾ ਕਰੋ।","Check your summary below, then send it to your coordinator. <b>Copy and the email buttons send a locked (encrypted) message that only your coordinator can open.<\/b> This form itself sends nothing over the internet.":"ਹੇਠਾਂ ਆਪਣਾ ਸਾਰ ਵੇਖੋ, ਫਿਰ ਇਸਨੂੰ ਆਪਣੇ ਕੋਆਰਡੀਨੇਟਰ ਨੂੰ ਭੇਜੋ। <b>ਕਾਪੀ ਅਤੇ ਈਮੇਲ ਬਟਨ ਇੱਕ ਬੰਦ (ਇਨਕ੍ਰਿਪਟ ਕੀਤਾ) ਸੁਨੇਹਾ ਭੇਜਦੇ ਹਨ ਜਿਸਨੂੰ ਸਿਰਫ਼ ਤੁਹਾਡਾ ਕੋਆਰਡੀਨੇਟਰ ਹੀ ਖੋਲ੍ਹ ਸਕਦਾ ਹੈ।<\/b> ਇਹ ਫਾਰਮ ਆਪਣੇ ਆਪ ਇੰਟਰਨੈੱਟ 'ਤੇ ਕੁਝ ਨਹੀਂ ਭੇਜਦਾ।","Encryption isn't available in this browser, so the send buttons are off. Please call your coordinator, or simply share your answers at the meeting.":"ਇਸ ਬ੍ਰਾਊਜ਼ਰ ਵਿੱਚ ਇਨਕ੍ਰਿਪਸ਼ਨ ਉਪਲਬਧ ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਭੇਜਣ ਵਾਲੇ ਬਟਨ ਬੰਦ ਹਨ। ਕਿਰਪਾ ਕਰਕੇ ਆਪਣੇ ਕੋਆਰਡੀਨੇਟਰ ਨੂੰ ਫ਼ੋਨ ਕਰੋ, ਜਾਂ ਆਪਣੇ ਜਵਾਬ ਮੀਟਿੰਗ ਵਿੱਚ ਸਾਂਝੇ ਕਰੋ।","Copying didn't work on this device. The message is selected below — press and hold (or Ctrl+C) to copy it, then paste it into an email.":"ਇਸ ਡਿਵਾਈਸ 'ਤੇ ਕਾਪੀ ਨਹੀਂ ਹੋ ਸਕੀ। ਸੁਨੇਹਾ ਹੇਠਾਂ ਚੁਣਿਆ ਹੋਇਆ ਹੈ — ਕਾਪੀ ਕਰਨ ਲਈ ਦਬਾ ਕੇ ਰੱਖੋ (ਜਾਂ Ctrl+C), ਫਿਰ ਇਸਨੂੰ ਈਮੇਲ ਵਿੱਚ ਪੇਸਟ ਕਰੋ।","If you already sent your answers to <b>{0}<\/b>, they'll review everything before your IPP meeting. If not, no problem — you can share your answers at the meeting.":"ਜੇ ਤੁਸੀਂ ਆਪਣੇ ਜਵਾਬ <b>{0}<\/b> ਨੂੰ ਪਹਿਲਾਂ ਹੀ ਭੇਜ function X(en,es,vals){
  let s = lang==="en" ? en : lang==="es" ? es : (((XTRA[lang]||{})[en]) ?? en);
  if(vals) for(let i=0;i<vals.length;i++) s = s.split("{"+i+"}").join(vals[i]);
  return s;
}
const tx = o => { if(!o) return ""; const v=o[lang]; if(v!=null) return v;
  const k=o.en, t=XTRA[lang], r=(t && typeof k==="string") ? t[k] : null;
  return r!=null ? r : (k ?? ""); };

const stage = document.getElementById("stage");

function render(){
  stopSpeak();          // navigating away stops any read-aloud in progress
  stage.innerHTML = "";
  document.getElementById("footPriv").textContent = tx(T.footer);
  const _bt=document.getElementById("barTtl");
  if(_bt){ _bt.textContent=tx(T.formTitle);
    // Title = home button: back to the welcome screen, keeping saved progress
    _bt.onclick=()=>{ if(idx!==-1){ idx=-1; persist(); render(); } };
    _bt.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); _bt.onclick(); } };
  }
  renderStepper();
  if (idx === -1){ renderWelcome(); return; }
  if (idx === STEPS.length){ renderReview(); return; }
  if (idx === STEPS.length+1){ renderDone(); return; }
  renderStep(STEPS[idx]);
  window.scrollTo({top:0,behavior:"smooth"});
}

// Segmented step bar: every step is an equal-width clickable cell, so the
// click position maps to the step (left = step 1, middle = ~step 5, etc.).
function renderStepper(){
  const w = document.getElementById("segWrap");
  if (idx < 0 || idx > STEPS.length){ w.style.display="none"; return; }  // hide on welcome/done
  w.style.display="block";
  const total = STEPS.length + 1; // steps + review
  let html = STEPS.map((s,i)=>`<button type="button" class="seg ${i===idx?"active":""} ${i<idx?"done":""}" data-go="${i}" title="${esc(tx(s.title))}" aria-label="${esc(tx(s.title))}">${i+1}</button>`).join("");
  html += `<button type="button" class="seg ${idx===STEPS.length?"active":""}" data-go="${STEPS.length}" title="${esc(tx(STEP_REVIEW_SHORT))}" aria-label="${esc(tx(STEP_REVIEW_SHORT))}">📑</button>`;
  const bar = document.getElementById("segBar");
  bar.innerHTML = html;
  bar.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{ idx=+b.dataset.go; persist(); render(); });
  const label = document.getElementById("segLabel");
  if (idx === STEPS.length) label.innerHTML = `${stepSVG("review",15,"#e8eaee")} <span>${tx(STEP_REVIEW_SHORT)} · ${X(T.stepOf.en,T.stepOf.es,[total,total])}</span>`;
  else label.innerHTML = `${stepSVG(STEP_ICON[idx],15,STEP_COLOR[idx])} <span>${tx(STEP_SHORT[idx])} · ${X(T.stepOf.en,T.stepOf.es,[idx+1,total])}</span>`;
  const _pf=document.getElementById("pFill");
  if(_pf){ const _n=(idx===STEPS.length)?total:(idx+1); _pf.style.width=Math.round(_n/total*100)+"%"; }
}

function renderStep(step){
  const d = document.createElement("div");
  d.className = "step active";
  let html = `<div class="intro"><div class="av" style="background:${STEP_COLOR[idx]}">${stepSVG(STEP_ICON[idx],24,"#fff")}</div><div><h2>${tx(step.title)}</h2><p>${tx(step.intro)}</p></div></div>`;
  step.fields.forEach(f=>{ html += fieldHTML(f); });
  html += `<div class="nav">
      <button class="btn ghost" id="backBtn">${tx(T.back)}</button>
      <button class="btn primary" id="nextBtn">${idx===STEPS.length-1?tx(T.review):tx(T.next)}</button>
    </div>
    <div class="saved" id="savedline">💾 ${tx(T.autosave)}</div>`;
  d.innerHTML = html;
  stage.appendChild(d);
  wireFields(step);
  document.getElementById("backBtn").onclick = ()=>{ idx--; persist(); render(); };
  document.getElementById("nextBtn").onclick = ()=>{ idx++; persist(); render(); };
}

/* Localized option label for a stored canonical value. Values stay canonical
   English in data/payload; only what the family SEES is translated. Custom
   (add-your-own) values have no option entry and display as typed. */
function locOptLabel(f,v){ const o=f&&f.options?f.options.find(o=>o.v===v):null; return o?tx(o):v; }
function fieldByKey(key){ for(const s of STEPS){ const f=s.fields.find(x=>x.key===key); if(f) return f; } return null; }

function fieldHTML(f){
  const hide = (f.showIf && !showIfMet(f)) ? `style="display:none"` : "";
  // info-only note (no input) — e.g. Medic Alert "would like info"
  if (f.type==="note"){
    return `<div class="field" data-fieldkey="${f.key}" ${hide}><div class="notebox"><span>ℹ️</span><span>${tx(f.label)}</span></div></div>`;
  }
  // Microsoft Bookings calendar card — Microsoft's CSP blocks true embedding
  // (frame-ancestors), so the card opens the live calendar in a new tab.
  // f.urlKey picks which VMRC_CONFIG link it uses (default = the video one).
  if (f.type==="booking"){
    const u=(window.VMRC_CONFIG[f.urlKey||"bookingUrl"]||"").trim();
    if(!u) return "";
    return `<div class="field" data-fieldkey="${f.key}" ${hide}>
      <label>${tx(f.label)}</label>
      <div class="bookcard">
      <div class="bkhead"><span class="bkcal">📅</span><span class="bktx">${X("Want to pick the meeting time yourself? Choose a time that works for you — online or in person.","¿Quiere elegir usted la hora de la reunión? Escoja el horario que mejor le convenga — en línea o en persona.")}</span></div>
      <a class="btn primary" id="bk_${f.key}" href="${esc(u)}" target="_blank" rel="noopener">📅 ${X("Pick a meeting time","Elegir la hora de la reunión")}</a>
    </div></div>`;
  }
  const optTag = f.optional ? `<span class="opt">${X("optional","opcional")}</span>` : "";
  const hint = f.hint ? `<div class="hint">${tx(f.hint)}</div>` : "";
  const tip  = f.tip ? `<div class="tipbox"><span>💊</span><span>${tx(f.tip)}</span></div>` : "";
  let inner = "";
  if (["text","tel","email","date"].includes(f.type)){
    inner = `<input type="${f.type}" data-key="${f.key}" value="${esc(data[f.key]||"")}" placeholder="${tx(f.ph)||""}">`;
  } else if (f.type==="dob3"){
    // "Dates simpler": three dropdowns instead of a date picker. Writes the same
    // ISO YYYY-MM-DD into data[key], so the payload/fence/IPP import are unchanged.
    // Month names come from Intl in the family's language (hmn falls back to English).
    const cur=(data[f.key]||"").split("-"), yy=cur[0]||"", mm=cur[1]||"", dd2=cur[2]||"";
    const months=MONTHS[lang]||MONTHS.en;   // shared per-language month tables (top of schema)
    const nowY=new Date().getFullYear();
    inner = `<div class="dob3" data-key="${f.key}">
      <select data-dob="m" aria-label="Month"><option value="">${X("Month","Mes")}</option>${months.map((n,i)=>{const v=String(i+1).padStart(2,"0");return `<option value="${v}" ${mm===v?"selected":""}>${esc(n)}</option>`;}).join("")}</select>
      <select data-dob="d" aria-label="Day"><option value="">${X("Day","Día")}</option>${Array.from({length:31},(_,i)=>{const v=String(i+1).padStart(2,"0");return `<option value="${v}" ${dd2===v?"selected":""}>${i+1}</option>`;}).join("")}</select>
      <select data-dob="y" aria-label="Year"><option value="">${X("Year","Año")}</option>${Array.from({length:95},(_,i)=>{const y=String(nowY-i);return `<option ${yy===y?"selected":""}>${y}</option>`;}).join("")}</select>
    </div>`;
  } else if (f.type==="textarea"){
    // 🎤 speak-instead-of-typing on long answers (hidden when the language has
    // no speech-recognition support, e.g. Hmong)
    const mic = (window.SpeechRecognition||window.webkitSpeechRecognition) && SPEECH_LOCALE[lang]
      ? `<button type="button" class="micbtn" data-mic="${f.key}" title="${X("Speak instead of typing","Hablar en vez de escribir")}" aria-label="${X("Speak instead of typing","Hablar en vez de escribir")}">🎤</button>` : "";
    inner = `<div class="tawrap"><textarea data-key="${f.key}" placeholder="${tx(f.ph)||""}">${esc(data[f.key]||"")}</textarea>${mic}</div>`+
            `<div class="micstatus" data-micstatus="${f.key}" hidden></div>`;
  } else if (f.type==="chips"){
    const sel = toArr(data[f.key]);
    const optVals = f.options.map(o=>o.v);
    // tx() so hmn/vi/tl/pa fall through to the XTRA dictionary — o[lang]??o.en
    // silently showed English options in those languages (fixed 2026-08-19)
    let chipsHtml = f.options.map(o=>`<div class="chip ${o.none?"none":""} ${sel.includes(o.v)?"on":""}" role="button" tabindex="0" aria-pressed="${sel.includes(o.v)?"true":"false"}" data-v="${esc(o.v)}" data-none="${o.none?1:0}">${tx(o)}</div>`).join("");
    if (f.addOther){
      const customs = sel.filter(v=>!optVals.includes(v));
      chipsHtml += customs.map(v=>`<div class="chip custom" role="button" tabindex="0" aria-label="${esc(v)} (remove)" data-v="${esc(v)}" data-custom="1">${esc(v)} <span class="cx">✕</span></div>`).join("");
    }
    inner = `<div class="chips" data-key="${f.key}" data-single="${f.single?1:0}">${chipsHtml}</div>`;
    if (f.addOther){
      inner += `<div class="addother"><input type="text" class="addother-inp" data-addother="${f.key}" placeholder="${tx(T.addOtherPh)}">`+
               `<button type="button" class="addother-btn" data-addotherbtn="${f.key}">${tx(T.add)}</button></div>`;
    }
    if (f.key==="insurance"){
      inner += `<button type="button" class="scanbtn" data-scan="insurance" data-scankey="${f.key}">📷 ${X("Scan an insurance card","Escanear una tarjeta de seguro")}</button>`+
        `<input type="file" accept="image/*" capture="environment" data-scaninput="${f.key}" style="display:none">`+
        `<div class="scanout" data-scanout="${f.key}"></div>`+
        `<div class="hint">📵 ${X("The photo is read on this device only — it is never saved or sent anywhere.","La foto se lee solo en este dispositivo — nunca se guarda ni se envía a ningún lado.")}</div>`;
    }
  } else if (f.type==="specialists"){
    // Structured specialist list (2026-08-19): tap a specialist chip → a card opens
    // for the doctor's name + last-visit month/year. Data = [{type,name,month,year}].
    const arr = Array.isArray(data[f.key]) ? data[f.key] : [];
    const selTypes = arr.map(r=>r.type);
    const optVals = f.options.map(o=>o.v);
    let chipsHtml = f.options.map(o=>`<div class="chip ${selTypes.includes(o.v)?"on":""}" role="button" tabindex="0" aria-pressed="${selTypes.includes(o.v)?"true":"false"}" data-spchip="${esc(o.v)}">${tx(o)}</div>`).join("");
    chipsHtml += selTypes.filter(v=>!optVals.includes(v)).map(v=>`<div class="chip custom on" role="button" tabindex="0" aria-label="${esc(v)} (remove)" data-spchip="${esc(v)}" data-custom="1">${esc(v)} <span class="cx">✕</span></div>`).join("");
    const months=MONTHS[lang]||MONTHS.en, nowY=new Date().getFullYear();
    const cards = arr.map((row,i)=>{
      const lbl = locOptLabel(f,row.type)||row.type||"";
      return `<div class="sp-card" data-spi="${i}">
        <div class="sp-title">${esc(lbl)}</div>
        <input type="text" data-spf="name" data-spi="${i}" value="${esc(row.name||"")}" placeholder="${tx(T.spName)}" autocomplete="off">
        <div class="sp-visit"><span class="sp-lbl">${tx(T.spVisit)}</span>
          <select data-spf="month" data-spi="${i}" aria-label="${X("Month","Mes")}"><option value="">${X("Month","Mes")}</option>${months.map((n,mi)=>{const v=String(mi+1).padStart(2,"0");return `<option value="${v}" ${row.month===v?"selected":""}>${esc(n)}</option>`;}).join("")}</select>
          <select data-spf="year" data-spi="${i}" aria-label="${X("Year","Año")}"><option value="">${X("Year","Año")}</option>${Array.from({length:12},(_,yi)=>{const y=String(nowY-yi);return `<option ${row.year===y?"selected":""}>${y}</option>`;}).join("")}</select>
        </div></div>`;
    }).join("");
    inner = `<div class="chips" data-spkey="${f.key}">${chipsHtml}</div><div class="sp-list" data-splist="${f.key}">${cards}</div>`;
    if (f.addOther){
      inner += `<div class="addother"><input type="text" class="addother-inp" data-addother="${f.key}" placeholder="${tx(T.addOtherPh)}"><button type="button" class="addother-btn" data-addotherbtn="${f.key}">${tx(T.add)}</button></div>`;
    }
  } else if (f.type==="dropdown"){
    const sel = toArr(data[f.key]);
    const optVals = f.options.map(o=>o.v);
    const summary = sel.length ? sel.map(v=>locOptLabel(f,v)).join(", ") : (X("Select…","Seleccione…"));
    let rows = f.options.map(o=>`<label class="dd-opt"><input type="checkbox" data-ddv="${esc(o.v)}" ${sel.includes(o.v)?"checked":""}><span>${tx(o)}</span></label>`).join("");
    if (f.addOther){
      const customs = sel.filter(v=>!optVals.includes(v));
      rows += customs.map(v=>`<label class="dd-opt"><input type="checkbox" data-ddv="${esc(v)}" data-custom="1" checked><span>${esc(v)} <span class="cx">(${X("yours","propio")})</span></span></label>`).join("");
    }
    const addo = f.addOther ? `<div class="addother"><input type="text" class="addother-inp" data-addother="${f.key}" placeholder="${tx(T.addOtherPh)}"><button type="button" class="addother-btn" data-addotherbtn="${f.key}">${tx(T.add)}</button></div>` : "";
    inner = `<div class="dropdown" data-key="${f.key}">`+
      `<button type="button" class="dd-head" data-ddhead="${f.key}"><span class="dd-summary ${sel.length?"":"ph"}">${esc(summary)}</span><span class="dd-caret">▾</span></button>`+
      `<div class="dd-panel" data-ddpanel="${f.key}" hidden>${rows}${addo}</div></div>`;
  } else if (f.type==="select"){
    const cur = (toArr(data[f.key])[0])||"";
    inner = `<select data-selectkey="${f.key}"><option value="">${X("Select…","Seleccione…")}</option>`+
      f.options.map(o=>`<option value="${esc(o.v)}" ${cur===o.v?"selected":""}>${tx(o)}</option>`).join("")+`</select>`;
  } else if (f.type==="engrave"){
    inner = engraveHTML(f);
  } else if (f.type==="repeat"){
    let picker = "";
    if (f.repeatKind==="med"){
      picker = `<select class="medpicker" data-medpicker="${f.key}"><option value="">${X("➕ Add a common medication…","➕ Agregar un medicamento común…")}</option>`+
        MED_LIST.map(m=>`<option value="${esc(m.name)}">${esc(m.name)} — ${esc(m.dose)}</option>`).join("")+`</select>`;
    }
    inner = picker + `<div class="repeat" data-key="${f.key}" data-kind="${f.repeatKind}"></div>`+
      `<button type="button" class="addbtn" data-add="${f.key}">${f.repeatKind==="med"?tx(T.addMed):tx(T.addContact)}</button>`;
    if (f.repeatKind==="med"){
      inner += `<button type="button" class="scanbtn" data-scan="med" data-scankey="${f.key}">📷 ${X("Scan a medicine bottle instead of typing","Escanear un frasco de medicamento en vez de escribir")}</button>`+
        `<input type="file" accept="image/*" capture="environment" data-scaninput="${f.key}" style="display:none">`+
        `<div class="scanout" data-scanout="${f.key}"></div>`+
        `<div class="hint">📵 ${X("The photo is read on this device only — it is never saved or sent anywhere.","La foto se lee solo en este dispositivo — nunca se guarda ni se envía a ningún lado.")}</div>`;
    }
  }
  const labelFor = ["chips","repeat","dropdown","engrave"].includes(f.type) ? "div" : "label";
  return `<div class="field" data-fieldkey="${f.key}" ${hide}>
      <${labelFor}>${tx(f.label)} ${optTag}</${labelFor}>${hint}${tip}${inner}</div>`;
}

/* ── Medic Alert engraving: auto-filled from earlier answers ── */
function engraveAuto(k){
  if(k==="name") return (data.preferred_name||data.legal_name||"").trim();
  if(k==="diagnosis") return toArr(data.diagnoses).join(", ");
  if(k==="allergies") return allergiesSummary();
  return "";
}
function allergiesSummary(){
  const a=toArr(data.allergies);
  if(a.includes("None")) return (X("None","Ninguna"));
  if(a.includes("Yes")) return (data.allergies_list||"").trim() || (X("Yes","Sí"));
  return "";
}
function engraveChecked(key){ return Array.isArray(data[key]) ? data[key] : ["name","diagnosis","allergies"]; }
function engraveHTML(f){
  const checked = engraveChecked(f.key);
  const phone = data.medic_alert_phone||"";
  const items=[
    ["name", X("Name","Nombre"), engraveAuto("name")],
    ["diagnosis", X("Diagnosis","Diagnóstico"), engraveAuto("diagnosis")],
    ["allergies", X("Allergies","Alergias"), engraveAuto("allergies")],
  ];
  const rows = items.map(([k,lbl,val])=>`<label class="eng-row"><input type="checkbox" data-engk="${k}" ${checked.includes(k)?"checked":""}>`+
    `<span class="eng-lbl">${lbl}</span><span class="eng-val ${val?"":"empty"}">${val?esc(val):(X("(blank)","(en blanco)"))}</span></label>`).join("");
  const phoneRow = `<div class="eng-row phone"><span class="eng-lbl">${X("Emergency phone","Tel. emergencia")}</span>`+
    `<input type="tel" data-engphone="1" value="${esc(phone)}" placeholder="(000) 000-0000"></div>`;
  return `<div class="engrave" data-key="${f.key}">${rows}${phoneRow}</div>`;
}

function wireFields(step){
  step.fields.forEach(f=>{
    const node=stage.querySelector(`.field[data-fieldkey="${f.key}"]`);
    if(node) wireOneField(step,f,node);
  });
}

function wireOneField(step,f,node){
  // text / textarea / tel / email / date
  node.querySelectorAll("input[data-key],textarea[data-key]").forEach(el=>{
    el.addEventListener("input", ()=>{ data[el.dataset.key]=el.value; persist(true); applyShowIf(step); });
  });
  // chips
  const box=node.querySelector(".chips[data-key]");
  if(box){
    const key=box.dataset.key, single=box.dataset.single==="1";
    box.querySelectorAll(".chip").forEach(chip=>{
      chip.onclick=()=>{
        let sel=toArr(data[key]); const v=chip.dataset.v, isNone=chip.dataset.none==="1", isCustom=chip.dataset.custom==="1";
        if(isCustom){ sel=sel.filter(x=>x!==v); data[key]=sel; persist(); rerenderField(step,key); applyShowIf(step); return; }
        if(single){ sel=[v]; }
        else if(isNone){ sel=sel.includes(v)?[]:[v]; }      // "None" clears others
        else { sel=sel.filter(x=>!isNoneVal(box,x)); sel = sel.includes(v)?sel.filter(x=>x!==v):[...sel,v]; }
        data[key]=sel; persist(true);
        box.querySelectorAll(".chip:not(.custom)").forEach(c=>{ const on=sel.includes(c.dataset.v); c.classList.toggle("on",on); c.setAttribute("aria-pressed",on?"true":"false"); });
        applyShowIf(step);
      };
    });
    // add-your-own
    const inp=node.querySelector(`[data-addother="${key}"]`);
    const addBtn=node.querySelector(`[data-addotherbtn="${key}"]`);
    if(inp && addBtn){
      const doAdd=()=>{ const val=(inp.value||"").trim(); if(!val) return;
        let sel=toArr(data[key]).filter(x=>!isNoneVal(box,x));  // adding a real value clears "None"
        if(!sel.some(x=>x.toLowerCase()===val.toLowerCase())) sel.push(val);
        data[key]=sel; inp.value=""; persist(); rerenderField(step,key); applyShowIf(step);

/* Dose stepper. ±10 on the first standalone number for weights/volumes
   (mg, mcg, g, ml, IU) or a bare number; countable things (puffs, tablets,
   drops…) step ±1 — "2 puffs" must never jump to 12. The number match skips
   digits glued to letters (B12) and fractions (1/2), and reads "1,000" /
   "1.000" digit-grouping as one thousand (label formats families copy).
   Empty + ▲ starts at "10 mg"; never below 0; nothing steppable → unchanged. */
function stepDose(s,dir){
  s=(s||"").trim();
  if(!s) return dir>0 ? "10 mg" : "";
  const re=/(^|[^A-Za-z0-9.,\/])((?:\d{1,3}(?:[.,]\d{3})+)|(?:\d+(?:\.\d+)?)|(?:\.\d+))(?![\d\/])/;
  const m=s.match(re);
  if(!m) return s;
  const numStr=m[2], start=m.index+m[1].length;
  const grouped=/^\d{1,3}(?:[.,]\d{3})+$/.test(numStr);
  const n0=grouped ? parseFloat(numStr.replace(/[.,]/g,"")) : parseFloat(numStr);
  const after=s.slice(start+numStr.length);
  const unit=(after.match(/^\s*([A-Za-zµ]+)/)||[])[1]||"";
  const step=(!unit||/^(mg|mcg|ug|µg|g|gr|ml|cc|iu|u)$/i.test(unit)) ? 10 : 1;
  let n=n0+dir*step; if(n<0) n=0;
  const nn=String(Math.round(n*100)/100);
  return s.slice(0,start)+nn+after;
}

function showIfMet(f){
  if(!f.showIf) return true;
  const cur=toArr(data[f.showIf[0]]);
  const want=Array.isArray(f.showIf[1])?f.showIf[1]:[f.showIf[1]];
  return cur.some(v=>want.includes(v));

}

/* ── Calendar reminders (.ics, 2026-07-23) ───────────────────────────
   PHI-FREE by design: the event says only "Family meeting" + a generic prep
   note — no names, no answers. Two built-in reminders (1 week / 1 day before).
   This is the one file the form writes, and it contains nothing personal.
   (Families who book via Microsoft Bookings also get its own automatic
   confirmation + invite; this covers phone-scheduled meetings and prep.) */
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsFold(line){ const out=[]; while(line.length>74){ out.push(line.slice(0,74)); line=" "+line.slice(74); } out.push(line); return out.join("\r\n"); }
function buildICS(dateStr,timeStr){
  const p=String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!p) return null;
  const pad=n=>String(n).padStart(2,"0");
  const stamp=(dt)=>dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+"T"+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+pad(dt.getUTCSeconds())+"Z";
  let dtLines;
  if(timeStr && /^\d{2}:\d{2}$/.test(timeStr)){
    const [hh,mi]=timeStr.split(":");
    const s=new Date(+p[1],+p[2]-1,+p[3],+hh,+mi), e=new Date(s.getTime()+60*60*1000);
    const loc=dt=>dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";
    dtLines=["DTSTART:"+loc(s),"DTEND:"+loc(e)];                    // floating local time
  }else{
    const s=new Date(+p[1],+p[2]-1,+p[3]), e=new Date(s.getTime()+24*60*60*1000);
    const day=dt=>dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate());
    dtLines=["DTSTART;VALUE=DATE:"+day(s),"DTEND;VALUE=DATE:"+day(e)];  // all-day
  }
  const uid=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)+"@ipp-meeting-intake";
  const lines=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ipp-meeting-intake//family form//EN",
    "BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+stamp(new Date()),...dtLines,
    "SUMMARY:"+icsEsc(X("Family meeting","Reunión familiar")),
    "DESCRIPTION:"+icsEsc(X("Get ready: bring medicine bottles, insurance cards, and any questions you want to ask.","Prepárese: lleve los frascos de medicamentos, las tarjetas de seguro y las preguntas que quiera hacer.")),
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P7D",
    "DESCRIPTION:"+icsEsc(X("Family meeting in one week — time to get ready","Reunión familiar en una semana — hora de prepararse")),"END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D",
    "DESCRIPTION:"+icsEsc(X("Family meeting tomorrow","Reunión familiar mañana")),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"];
  return lines.map(icsFold).join("\r\n")+"\r\n";
}

/* ═══════════════════════════════════════════════════════════════════
   3b) 📷 PHOTO SCAN — med bottles & insurance cards
   OCR runs entirely IN THE BROWSER (tesseract.js, lazy-loaded from a CDN on
   first use). The photo is processed in memory and never stored, uploaded,
   or added to the answers — zero PHI egress. Offline copies simply show a
   friendly "needs internet" note if the library can't load.
   ═══════════════════════════════════════════════════════════════════ */
let _tessP=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(_tessP) return _tessP;
  _tessP=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=()=>res(); s.onerror=()=>{ _tessP=null; rej(new Error("offline")); };
    document.head.appendChild(s); });
  return _tessP;
}
function normOCR(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9 .\/-]/g," ").replace(/\s+/g," "); }
// Fuzzy med match: any generic/brand token (≥5 chars) from MED_LIST found in the
// OCR text wins; longest token wins ties. Dose from a units regex.
function __matchMed(text){
  const T=normOCR(text);
  let best=null;
  MED_LIST.forEach(m=>{
    m.name.split(/[()\/]/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
      const TK=tok.toUpperCase();
      if(TK.length>=5 && T.indexOf(TK)>-1 && (!best || TK.length>best.tok.length)) best={name:m.name, tok:TK, dose:m.dose};
    });
  });
  const dm=T.match(/(\d+(?:\.\d+)?)\s?(MCG|MG|ML|IU|UNITS?|G)\b/);
  return { name: best?best.name:null,
           dose: dm?(dm[1]+" "+dm[2].toLowerCase()):"",
           raw: T.slice(0,120) };
}
const INS_PATTERNS=[
  [/MEDI[\s-]?CAL|MEDICAID|BENEFITS IDENTIFICATION/, "Medi-Cal"],
  [/SAN JOAQUIN|HPSJ/, "Health Plan San Joaquin"],
  [/KAISER/, "Kaiser"],
  [/AETNA/, "Aetna"],
  [/BLUE (CROSS|SHIELD)|ANTHEM|UNITED ?HEALTH|CIGNA|HEALTH ?NET/, "Private insurance"],
];
function __matchInsurance(text){ const T=normOCR(text); return INS_PATTERNS.filter(p=>p[0].test(T)).map(p=>p[1]); }
window.__matchMed=__matchMed; window.__matchInsurance=__matchInsurance;  // exposed for the test suite

async function runScan(kind,key,file,step){
  const out=stage.querySelector(`[data-scanout="${key}"]`); if(!out) return;
  out.innerHTML=`<div class="scanwait">⏳ ${X("Reading the photo on this device… (about 10 seconds)","Leyendo la foto en este dispositivo… (unos 10 segundos)")}</div>`;
  let text="";
  try{
    await loadTesseract();
    const r=await Tesseract.recognize(file,"eng");
    text=(r&&r.data&&r.data.text)||"";
  }catch(err){
    out.innerHTML=`<div class="scanerr">📶 ${X("Scanning needs an internet connection the first time. You can type it instead — the biggest words on the label are the medicine name.","Escanear necesita conexión a internet la primera vez. También puede escribirlo — las palabras más grandes de la etiqueta son el nombre del medicamento.")}</div>`;
    return;
  }
  if(kind==="med"){
    const m=__matchMed(text);
    if(m.name||m.dose){
      const nm=m.name||X("(couldn't read the name — please type it)","(no pudimos leer el nombre — escríbalo por favor)");
      out.innerHTML=`<div class="scanhit"><b>${esc(nm)}</b>${m.dose?` — ${esc(m.dose)}`:""}
        <div class="btnrow">
          <button type="button" class="scanadd">✓ ${X("Add it","Agregarlo")}</button>
          <button type="button" class="scanno">${X("No, I'll type it","No, lo escribo")}</button>
        </div></div>`;
      out.querySelector(".scanadd").onclick=()=>{
        const arr=Array.isArray(data[key])?data[key]:[];
        arr.push({name:m.name||"", dose:m.dose||""}); data[key]=arr; persist();
        renderRepeat(stage.querySelector(`.repeat[data-key="${key}"]`));
        out.innerHTML=`<div class="scanok">✓ ${X("Added — please double-check the name and dose against the bottle.","Agregado — verifique el nombre y la dosis con el frasco.")}</div>`;
      };
      out.querySelector(".scanno").onclick=()=>{ out.innerHTML=""; };
    } else {
      out.innerHTML=`<div class="scanerr">🤔 ${X("We couldn't read that label. Try a closer, well-lit photo of the biggest words — or type it in.","No pudimos leer esa etiqueta. Intente una foto más cerca y con buena luz — o escríbalo.")}</div>`;
    }
  } else {
    const hits=__matchInsurance(text);
    if(hits.length){
      let sel=toArr(data[key]); hits.forEach(v=>{ if(sel.indexOf(v)<0) sel.push(v); }); data[key]=sel; persist();
      rerenderField(step,key);
      const out2=stage.querySelector(`[data-scanout="${key}"]`);
      if(out2) out2.innerHTML=`<div class="scanok">✓ ${X("Found on the card: {0} — selected it for you. Please double-check.","Encontrado en la tarjeta: {0} — lo seleccionamos por usted. Verifique por favor.",[esc(hits.join(", "))])}</div>`;
    } else {
      out.innerHTML=`<div class="scanerr">🤔 ${X("We couldn't recognize the plan on that card. Try a straight, well-lit photo of the front — or tap the choices above.","No reconocimos el plan en esa tarjeta. Intente una foto derecha y con buena luz — o toque las opciones arriba.")}</div>`;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   3c) 🔊 READ-ALOUD + 🎤 VOICE TYPING
   Read-aloud uses the device's built-in voices (speechSynthesis) — fully
   on-device. Voice typing uses the device's speech service; because that
   audio may be processed by Google/Apple, the FIRST use shows a plain-
   language consent note and typing stays the private default.
   ═══════════════════════════════════════════════════════════════════ */
const SPEECH_LOCALE={en:"en-US",es:"es-MX",hmn:"",vi:"vi-VN",tl:"fil-PH",pa:"pa-IN"};

function pageSpeechChunks(){
  // Visible, meaningful text only — headings, questions, hints, review/bring
  // items. Never input/textarea values except the review screen's own text.
  const sels="h1,h2,h3,.intro p,.welcome p,.wpts div,.field>label,.field>div:first-child,.hint,.tipbox,.notebox,.bri,.rev-item .k,.rev-item .v,.done-next div,.fallback p,.sendto";
  const out=[];
  stage.querySelectorAll(sels).forEach(el=>{
    if(el.closest("[hidden],.scanout")) return;
    if(el.offsetParent===null) return;               // display:none
    const t=(el.innerText||"").replace(/\s+/g," ").trim();
    if(t && t.length>1 && out.indexOf(t)<0) out.push(t);
  });
  return out;
}
/* Clip-first player: pre-generated soft female neural voice clips (Jenny/Dalia/
   HoaiMy/Blessica) are fetched from the site's audio/ folder — same warm voice on
   EVERY device, no language pack needed. Dynamic text (the family's own answers,
   substituted names) falls back to a female-preferred device voice, softened.
   Clips are keyed by fnv64 of the display text; gen_audio.py mirrors the hash.
   Punjabi has no neural voice offered; Hmong has no TTS anywhere — both use the
   device fallback, and human-recorded clips can be dropped into audio/pa|hmn/. */
const AUDIO_BASE = window.VMRC_AUDIO_BASE ||
  (location.protocol==="file:" ? "https://ipp-meeting-intake.github.io/audio/" : "audio/");
const CLIP_LANGS = {en:1,es:1,vi:1,tl:1,pa:1,hmn:1};  // folders probed; missing clip → fallback
function fnv64(str){
  const b=new TextEncoder().encode(str.normalize("NFC").replace(/\s+/g," ").trim());
  let h=0xcbf29ce484222325n;
  for(const x of b){ h^=BigInt(x); h=(h*0x100000001b3n)&0xffffffffffffffffn; }
  return h.toString(16).padStart(16,"0");
}
let audioEl=null, speakToken=0;
window.__readPlan=[];   // {t,mode:"clip"|"tts"} — observability + test hook
function stopSpeak(){
  speakToken++;
  if(audioEl){ try{ audioEl.pause(); }catch(e){} audioEl=null; }
  if("speechSynthesis" in window) try{ speechSynthesis.cancel(); }catch(e){}
  const b=document.getElementById("readBtn");
  if(b){ b.classList.remove("on"); b.setAttribute("aria-pressed","false"); b.textContent="🔊"; }
}
function playClip(text,tok){
  return new Promise(res=>{
    const a=new Audio(AUDIO_BASE+lang+"/"+fnv64(text)+".mp3");
    audioEl=a;
    let started=false, settled=false;
    const done=ok=>{ if(settled) return; settled=true;
      if(ok) window.__readPlan.push({t:text,mode:"clip"});
      res(ok); };
    a.onplaying=()=>{ started=true; };
    a.onended=()=>done(true);
    a.onerror=()=>done(false);
    setTimeout(()=>{ if(!started && !settled){ try{a.pause();}catch(e){} done(false); } },8000);
    a.play().catch(()=>done(false));
  });
}
function speakUtter(text,tok,localOnly){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)) return res(false);
    const want=SPEECH_LOCALE[lang];
    if(!want) return res(false);                     // no recognition locale (hmn)
    const vs=speechSynthesis.getVoices();
    let cands=vs.filter(v=>(v.lang||"").toLowerCase().indexOf(want.slice(0,2).toLowerCase())===0);
    // Privacy: pages that read ANSWERS aloud must use on-device voices only —
    // cloud voices (localService:false) would transmit the text to a server.
    if(localOnly) cands=cands.filter(v=>v.localService);
    if(vs.length && !cands.length) return res(false); // device lacks this language
    const fem=/female|jenny|aria|ava|zira|susan|sonia|libby|natasha|michelle|sabina|dalia|paulina|helena|camila|hoai|linh|blessica|rosa|angela|swara|vaani|heera/i;
    const voice=cands.find(v=>fem.test(v.name))||cands[0]||null;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=want; if(voice) u.voice=voice;
    u.rate=0.92; u.pitch=1.05;                       // softer, calmer delivery
    let settled=false;
    const done=ok=>{ if(settled) return; settled=true;
      if(ok) window.__readPlan.push({t:text,mode:"tts"});
      res(ok); };
    u.onend=()=>done(true);
    u.onerror=()=>done(false);
    setTimeout(()=>done(false), Math.min(20000, 3000+text.length*130)); // engine-hang guard
    try{ speechSynthesis.speak(u); }catch(e){ done(false); }
  });
}
async function speakPage(){
  const chunks=pageSpeechChunks();
  if(!chunks.length) return;
  const tok=++speakToken;
  const b=document.getElementById("readBtn");
  b.classList.add("on"); b.setAttribute("aria-pressed","true"); b.textContent="⏹";
  let played=0;
  // The review screen reads the family's ANSWERS. Never probe the audio server
  // there (URL hashes would leak answer text) and never use cloud voices.
  const privatePage = idx===STEPS.length;
  for(const c of chunks){
    if(tok!==speakToken) return;                     // stopped / navigated away
    let ok = (!privatePage && CLIP_LANGS[lang]) ? await playClip(c,tok) : false;
    if(!ok && tok===speakToken) ok = await speakUtter(c,tok,privatePage);
    if(ok) played++;
  }
  if(tok!==speakToken) return;
  stopSpeak();
  if(!played){
    alert(X("Sorry — no {0} voice is installed on this device, so read-aloud isn't available.","Lo sentimos — este dispositivo no tiene una voz en {0}, así que la lectura en voz alta no está disponible.",[langName(lang)]));
  }
}
document.getElementById("readBtn").onclick=()=>{
  const b=document.getElementById("readBtn");
  if(b.classList.contains("on")){ stopSpeak(); return; }
  speakPage();
};

function wireMic(node,step){
  node.querySelectorAll("[data-mic]").forEach(btn=>{
    const key=btn.dataset.mic;
    btn.onclick=()=>{

      if(!SR) return;

        LS.set(SAVE_KEY+"_micok","1");

      };
      r.onerror=()=>{ done();
        if(st){ st.hidden=false; st.textContent=X("Voice typing didn't work here — you can use the microphone button on your keyboard instead.","La voz no funcionó aquí — puede usar el botón de micrófono de su teclado."); } };
      r.onend=done;
      try{ r.start(); }catch(e){ done(); }
